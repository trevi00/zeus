[project]
name = "zeus-harness"
version = "0.3.0.dev0"
description = "Zeus: evidence-driven work, independent review, and recoverable Codex operations"
requires-python = ">=3.12"
# S1 adapters (storage, host_os) and S2 adapters (context YAML/pipeline, knowledge graph/embeddings)
# need exactly the SOURCE runtime libraries of their M7 counterparts; the lock pins the SOURCE uv.lock
# versions so validation messages, parse trees and wire behaviour compare equal.
dependencies = [
  "fastembed>=0.8.0",
  "filelock>=3.20,<4",
  "jsonschema[format]>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "redis>=5.2,<7",
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-python>=0.23,<0.26",
]

[project.scripts]
zeus = "codex_harness.cli:main"
zeus-supervisor = "codex_harness.supervisor:main"
zeus-monitor = "codex_harness.monitor:main"
harness = "codex_harness.cli:main"
harness-supervisor = "codex_harness.supervisor:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_harness", "src/zeus"]

# S11 unit P (OWNER-DECISIONS-S11 #8): the sdist (and the wheel uv builds from it) never carries the
# archived SOURCE tree or the never-shipped comparison/coverage harnesses.
[tool.hatch.build.targets.sdist]
exclude = ["/reference", "/compare", "/coverage", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# S11 unit P: the archived SOURCE tests are never collected from the promoted tree.
addopts = "--ignore=reference"
markers = ["integration: requires disposable PostgreSQL/Redis (R-X); never production endpoints"]

[tool.ruff]
line-length = 110
target-version = "py312"
# S11 unit P: the archived SOURCE bytes are reference-only.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Import-rule fixtures are tiny packages whose imports are the test subject (§3.6).
"tests/fixtures/**/*.py" = ["F401", "I001", "E402"]
# Kept from the M7 root configuration (S11 unit P, OWNER-DECISIONS-S11 #7): recorded reviewer probes
# and review archives keep their original bytes, which their own manifests pin.
"docs/full-analysis/**/*.py" = ["E401", "E701", "E702", "F401", "I001"]
"docs/zeus/wsl-validation/*.py" = ["F401", "I001"]
"docs/zeus/reviews/**/*.py" = ["E401", "E402", "E701", "E702", "F401", "I001"]
# Implementation probes are recorded evidence too; their import blocks were sorted against the M7
# tree, where every cited codex_harness path existed.
"docs/zeus/implementation/**/probe.py" = ["I001"]
