# Buzz Batch D2: the disposable stack of the isolated end-to-end runner (tests/fixtures/buzz_e2e/run_e2e.py).
#
# The relay, postgres and redis services are the A4 stack (tests/fixtures/buzz_conntest/compose.yaml) with the SAME image
# digests and the same env scheme; only the project name and the interpolation variables differ, and the test-only
# BUZZ_SEND_BUFFER of A4 B7 is dropped (the bridge needs the relay's default buffer). PLUS `zeus-postgres`: the pgvector
# digest the compare harness pins, on its OWN bridge network (`zeus-db`, never the relay's), published only on
# 127.0.0.1:${ZEUS_E2E_PG_PORT}. Zeus's PG is never the relay's PG (DESIGN-D §4, §10.1 separation).
# Every resource carries com.docker.compose.project=zeus-buzz-e2e, the label of the runner's residue check and `down -v`.
# Every secret comes from the runner-generated env file ${BUZZ_E2E_ENV_FILE} (mode 0600, under the run's work dir).
# No privileged mode, no host network, no docker socket, no cap_add, no 0.0.0.0 publish. (BUZZ_BIND_ADDR below is the
# address INSIDE the container; the host side is the loopback publish.)
name: zeus-buzz-e2e

services:
  relay:
    image: ghcr.io/block/buzz@sha256:7049e2efaf59dd2501159e6103d27a6cce28e4a9012caa82d121a5a15308eddb
    env_file:
      # RELAY_OWNER_PUBKEY, BUZZ_RELAY_PRIVATE_KEY, BUZZ_GIT_HOOK_HMAC_SECRET (and the interpolation values).
      - ${BUZZ_E2E_ENV_FILE:?set by the test}
    environment:
      RELAY_URL: ws://127.0.0.1:${BUZZ_E2E_PORT:?set by the test}
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_AUTO_MIGRATE: "true"
      # Owner A4 run 2: the git object-store conformance probe is fatal without S3 (main.rs:698ff); the E2E uses no git
      # or media features, so this stack runs no object store. Test-only; never production.
      BUZZ_GIT_CONFORMANCE_PROBE: "false"
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:${POSTGRES_PASSWORD:?set by the test}@postgres:5432/buzz
      REDIS_URL: redis://:${REDIS_PASSWORD:?set by the test}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set by the test}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set by the test}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    ports:
      - target: 3000
        published: "${BUZZ_E2E_PORT:?set by the test}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The readiness healthcheck exactly as Buzz's compose: /_readiness over /dev/tcp (bash, no curl).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    restart: "no"
    networks:
      - internal
      - edge

  postgres:
    # Buzz's compose pins the tag only: the owner replaces the placeholder with the digest of postgres:17-alpine.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by the test}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    networks:
      - internal

  redis:
    # Buzz's compose pins the tag only: the owner replaces the placeholder with the digest of redis:7-alpine.
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set by the test}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set by the test}
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: "no"
    networks:
      - internal

  zeus-postgres:
    # The fixture Zeus's own PostgreSQL (the digest the compare harness pins), on its own network and loopback port.
    image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: zeus
      POSTGRES_USER: zeus
      POSTGRES_PASSWORD: ${ZEUS_E2E_PG_PASSWORD:?set by the test}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - target: 5432
        published: "${ZEUS_E2E_PG_PORT:?set by the test}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - zeus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    networks:
      - zeus-db

volumes:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-git-data:
  zeus-postgres-data:

networks:
  # The fixture Zeus's postgres lives on this bridge only (it needs a non-internal network for its loopback publish);
  # the relay is not attached to it.
  zeus-db:
    driver: bridge
  # postgres and redis live here only: no route out, no published port.
  internal:
    internal: true
  # The relay's loopback publish needs a non-internal network.
  edge:
    driver: bridge
