# Buzz relay stack TEMPLATE (Buzz DESIGN-D section 5), derived from the relay stack of tests/fixtures/buzz_e2e/compose.yaml
# with the SAME image digests. Prepared by D4; NOTHING starts it: the production install belongs to the ONE section-10
# user request. Placeholders are @NAME@; the lint is `run_e2e.py --lint-templates`.
#
# No S3 / MinIO service: the relay starts without one (Q-A4-3: MediaConfig defaults, no startup reachability check), so
# MEDIA IS UNAVAILABLE (upload and download fail at use) unless the section-10.1 hosting decision adds an S3-compatible
# store. The git object-store probe is fatal without S3, so it is switched off.
# Every secret comes from the env file @ENV_FILE@ (mode 0600), never inline: RELAY_OWNER_PUBKEY, BUZZ_RELAY_PRIVATE_KEY,
# BUZZ_GIT_HOOK_HMAC_SECRET, DATABASE_URL, REDIS_URL, POSTGRES_PASSWORD, REDIS_PASSWORD.
# The relay is published ONLY on loopback; the address inside the container (BUZZ_BIND_ADDR) is not the host side.
name: zeus-buzz-relay

services:
  relay:
    image: ghcr.io/block/buzz@sha256:7049e2efaf59dd2501159e6103d27a6cce28e4a9012caa82d121a5a15308eddb
    env_file:
      - "@ENV_FILE@"
    environment:
      RELAY_URL: "@RELAY_PUBLIC_URL@"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "false"
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      BUZZ_GIT_REPO_PATH: /data/git
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    ports:
      - target: 3000
        published: "@RELAY_PORT@"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    restart: unless-stopped
    networks:
      - internal
      - edge

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    env_file:
      - "@ENV_FILE@"
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    env_file:
      - "@ENV_FILE@"
    # The password reaches redis-server through the container's own environment (the env file), never through this file.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

volumes:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-git-data:

networks:
  # postgres and redis live here only: no route out, no published port.
  internal:
    internal: true
  # The relay's loopback publish needs a non-internal network.
  edge:
    driver: bridge
