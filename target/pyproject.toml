[project]
name = "zeus-harness"
version = "0.3.0.dev0"
description = "Zeus rebuild target distribution (REBUILD-DESIGN-v2 §3.1). S1: kernel, storage, host_os; S2: routing, context, knowledge."
requires-python = ">=3.12"
# S1 adapters (storage, host_os) and S2 adapters (context YAML/pipeline, knowledge graph/embeddings)
# need exactly the SOURCE runtime libraries of their M7 counterparts; the lock pins the SOURCE uv.lock
# versions so validation messages, parse trees and wire behaviour compare equal.
dependencies = [
  "fastembed>=0.8.0",
  "filelock>=3.20,<4",
  "jsonschema[format]>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6,<7",
  "redis>=5.2,<7",
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-python>=0.23,<0.26",
]

[project.scripts]
zeus = "codex_harness.cli:main"
zeus-supervisor = "codex_harness.supervisor:main"
zeus-monitor = "codex_harness.monitor:main"
harness = "codex_harness.cli:main"
harness-supervisor = "codex_harness.supervisor:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_harness", "src/zeus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL/Redis (R-X); never production endpoints"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Import-rule fixtures are tiny packages whose imports are the test subject (§3.6).
"tests/fixtures/**/*.py" = ["F401", "I001", "E402"]
