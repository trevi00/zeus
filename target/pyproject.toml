[project]
name = "zeus-harness"
version = "0.3.0.dev0"
description = "Zeus rebuild target distribution (REBUILD-DESIGN-v2 §3.1). S0: guardrails only, no product implementation."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL/Redis (R-X); never production endpoints"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Import-rule fixtures are tiny packages whose imports are the test subject (§3.6).
"tests/fixtures/**/*.py" = ["F401", "I001", "E402"]
