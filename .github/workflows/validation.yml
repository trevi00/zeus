name: Linux validation
# Routing design: docs/zeus/operations/ci-separation-001/SPEC.md. Branch pushes no longer run a
# duplicate suite; pull requests and main pushes keep the full matrix unless the change set is
# only operations Markdown, and `CI gate` fails closed on anything unexpected.
on:
  pull_request:
  push:
    # The rebuild branch runs the full gate on push: its S0 evidence is exact-candidate CI (§5.1).
    branches: [main, 'rebuild/**']
  workflow_dispatch:

permissions:
  contents: read

# Same-PR runs supersede each other; main pushes and manual runs get a unique group and never cancel.
concurrency:
  group: validation-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: scope
        run: python scripts/ci_scope.py classify
  docs:
    needs: changes
    if: needs.changes.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/ci_scope.py docs-check
  test:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Schema preservation tests compare an immutable historical revision.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.2
      - run: uv sync --frozen
      - run: uv run ruff check .
      # The unchanged reference tests run against the immutable SOURCE tree (REBUILD-DESIGN-v2
      # §5.1), where their own workflow fixture is still the M7 file; check-tree below proves every
      # reference path of this candidate is byte-identical to that tree.
      - run: git worktree add --detach "$RUNNER_TEMP/zeus-source" e38aa722ff1e91dc01ec650689cfe3eebe1ff699
      - run: uv sync --frozen
        working-directory: ${{ runner.temp }}/zeus-source
      - run: uv run pytest -q
        working-directory: ${{ runner.temp }}/zeus-source
      - run: uv build
      - run: uv run harness-supervisor --help
      - run: uv run zeus --version
      - run: uv run python -m zeus ticket --help
      - run: uv run zeus-monitor --help
      # Rebuild gates: source-tree preservation, the target tree, the reference comparison.
      - run: python compare/run.py check-tree
      - run: uv sync --frozen --project target
      - run: uv run --project target ruff check target
      - run: uv run pytest -q
        working-directory: target
      - run: uv build --project target
      - if: matrix.python == '3.12'
        run: python compare/run.py prepare
      - if: matrix.python == '3.12'
        run: python compare/run.py run
  integration:
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.2
      # The M7 integration commands run unchanged in the immutable SOURCE tree (as in the test job);
      # `scripts/check.py --integration` includes the reference suite with its M7 workflow fixture.
      - run: git worktree add --detach "$RUNNER_TEMP/zeus-source" e38aa722ff1e91dc01ec650689cfe3eebe1ff699
      - run: uv sync --frozen
        working-directory: ${{ runner.temp }}/zeus-source
      - run: uv run harness setup
        working-directory: ${{ runner.temp }}/zeus-source
      - run: docker compose version
        working-directory: ${{ runner.temp }}/zeus-source
      - run: docker compose -p harness-ci up -d --wait postgres redis
        working-directory: ${{ runner.temp }}/zeus-source
      - run: uv run python scripts/check.py --integration
        working-directory: ${{ runner.temp }}/zeus-source
      - run: uv run pytest -q tests/test_verification.py tests/test_host_interruption.py
        working-directory: ${{ runner.temp }}/zeus-source
        env:
          ZEUS_TEST_DOCKER: '1'
      # §2.9 decision/release/outbox discriminators on a labelled, network-less disposable
      # PostgreSQL started by the runner through the default-deny Docker guard (S0 F3).
      - run: python compare/run.py prepare
      - run: python compare/run.py run --only effects.decision_unit.pg --pg
      # S1 storage differentials on labelled, network-less disposable PostgreSQL and Redis fixtures:
      # the target side runs in the target venv against the same fixture server (§5.3 S1).
      - run: uv sync --frozen --project target
      - run: python compare/run.py run --only storage.pg --only storage.redis --pg --redis
      # The target suite with its integration tests (ported PostgreSQL/Redis cases) on the same
      # kind of labelled disposable fixtures; the compose services above are never used by it (R-X).
      - run: python compare/run.py target-integration
      - if: always()
        run: docker compose -p harness-ci down --volumes
        working-directory: ${{ runner.temp }}/zeus-source
  gate:
    name: CI gate
    if: always()
    needs: [changes, docs, test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/ci_scope.py gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
