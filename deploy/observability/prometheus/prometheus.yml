# DESIGN §5.1 / §7: one scrape job against the collector on the private network; no Alertmanager.
global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/tokobs.yml

scrape_configs:
  - job_name: tokobs
    static_configs:
      - targets: ["collector:9469"]
